name: AI Risk Assessment

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-risk-assessment:
    name: Intelligent Risk Assessment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      
      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.base_ref }}
      
      - name: AI-Powered Change Analysis
        id: analyze
        run: |
          echo "Starting AI-powered risk assessment..."
          
          # Get changed files
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          
          # Count changes
          TOTAL_FILES=$(wc -l < changed_files.txt)
          ADDED_LINES=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk 'BEGIN{sum=0} {sum+=$1} END {print sum}')
          DELETED_LINES=$(git diff --numstat origin/${{ github.base_ref }}...HEAD | awk 'BEGIN{sum=0} {sum+=$2} END {print sum}')
          
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "added_lines=$ADDED_LINES" >> $GITHUB_OUTPUT
          echo "deleted_lines=$DELETED_LINES" >> $GITHUB_OUTPUT
          
          # Calculate risk score (0-100)
          RISK_SCORE=0
          
          # Risk factors
          if [ $TOTAL_FILES -gt 50 ]; then
            RISK_SCORE=$((RISK_SCORE + 30))
          elif [ $TOTAL_FILES -gt 20 ]; then
            RISK_SCORE=$((RISK_SCORE + 15))
          fi
          
          if [ $ADDED_LINES -gt 1000 ]; then
            RISK_SCORE=$((RISK_SCORE + 30))
          elif [ $ADDED_LINES -gt 500 ]; then
            RISK_SCORE=$((RISK_SCORE + 15))
          fi
          
          # Check for sensitive files
          if grep -qE '\.(env|key|pem|p12|pfx)$' changed_files.txt; then
            RISK_SCORE=$((RISK_SCORE + 40))
          fi
          
          if grep -qE 'config|secret|password|credential' changed_files.txt; then
            RISK_SCORE=$((RISK_SCORE + 20))
          fi
          
          # Cap at 100
          if [ $RISK_SCORE -gt 100 ]; then
            RISK_SCORE=100
          fi
          
          echo "risk_score=$RISK_SCORE" >> $GITHUB_OUTPUT
          
          # Determine risk level
          if [ $RISK_SCORE -ge 70 ]; then
            RISK_LEVEL="HIGH"
          elif [ $RISK_SCORE -ge 40 ]; then
            RISK_LEVEL="MEDIUM"
          else
            RISK_LEVEL="LOW"
          fi
          
          echo "risk_level=$RISK_LEVEL" >> $GITHUB_OUTPUT
          
          echo "Risk assessment completed: $RISK_LEVEL ($RISK_SCORE/100)"
      
      - name: Generate AI Risk Report
        run: |
          cat > risk-report.md <<EOF
          # 🤖 AI Risk Assessment Report
          
          **Pull Request:** #${{ github.event.pull_request.number }}
          **Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`
          **Author:** @${{ github.event.pull_request.user.login }}
          **Assessment Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          ## Risk Score: ${{ steps.analyze.outputs.risk_score }}/100
          
          ### Risk Level: ${{ steps.analyze.outputs.risk_level }}
          
          ## Change Statistics
          
          - **Files Changed:** ${{ steps.analyze.outputs.total_files }}
          - **Lines Added:** ${{ steps.analyze.outputs.added_lines }}
          - **Lines Deleted:** ${{ steps.analyze.outputs.deleted_lines }}
          
          ## AI Analysis
          
          The AI agent has analyzed this pull request and assigned a risk level based on:
          
          1. **Scope of Changes** - Number of files and lines modified
          2. **Sensitive File Detection** - Configuration, secrets, or credential files
          3. **Code Complexity** - Pattern analysis and change density
          4. **Security Implications** - Potential security impact
          
          EOF
          
          # Add risk-specific recommendations
          if [ "${{ steps.analyze.outputs.risk_level }}" = "HIGH" ]; then
            cat >> risk-report.md <<EOF
          ## ⚠️ Recommendations for HIGH Risk Changes
          
          - ✅ Require additional code reviews
          - ✅ Perform thorough testing before merge
          - ✅ Consider breaking into smaller PRs
          - ✅ Review security implications carefully
          - ✅ Update documentation for significant changes
          
          EOF
          elif [ "${{ steps.analyze.outputs.risk_level }}" = "MEDIUM" ]; then
            cat >> risk-report.md <<EOF
          ## ⚡ Recommendations for MEDIUM Risk Changes
          
          - ✅ Standard code review process
          - ✅ Run integration tests
          - ✅ Review changed files for unintended modifications
          - ✅ Verify backward compatibility
          
          EOF
          else
            cat >> risk-report.md <<EOF
          ## ✅ Recommendations for LOW Risk Changes
          
          - ✅ Standard review process
          - ✅ Run basic tests
          - ✅ Proceed with normal merge workflow
          
          EOF
          fi
          
          cat >> risk-report.md <<EOF
          ---
          
          *This assessment was generated by the AI Risk Assessment Agent v1.0.0*
          EOF
          
          cat risk-report.md
      
      - name: Comment Risk Assessment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('risk-report.md', 'utf8');
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('AI Risk Assessment Report')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
      
      - name: Upload Risk Report
        uses: actions/upload-artifact@v4.4.3
        with:
          name: ai-risk-assessment-report
          path: risk-report.md
          retention-days: 90
      
      - name: Fail on High Risk (Optional)
        if: steps.analyze.outputs.risk_level == 'HIGH' && github.event.pull_request.draft == false
        run: |
          echo "::warning::This PR has been flagged as HIGH RISK by the AI agent"
          echo "::notice::Consider additional reviews and testing before merging"
          # Uncomment the next line to block high-risk PRs
          # exit 1
